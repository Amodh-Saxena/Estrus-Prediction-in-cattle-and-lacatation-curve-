    dim_35_peak: 0.16
    dim_70_trough: 0.06
    dim_100: 0.09
  activity_strength_h2:
    dim_20_peak: 0.18
    dim_35: 0.16
    dim_70_trough: 0.06
    dim_100: 0.09
  rumination_strength_h2:
    dim_20: 0.15
    dim_32_peak: 0.18
    dim_70_trough: 0.05
