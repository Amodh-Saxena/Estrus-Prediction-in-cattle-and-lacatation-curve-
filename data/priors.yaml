# Literature constants and published empirical priors
# Source: Expression of estrus in dairy cows phenotyping, ge/SupplementaryFigures.pdf
# Cohort: Holstein dairy cows (>50% Holstein), Summer 2022, Professional Insemination Technician 1

supplementary_figure_1:
  title: "Pregnancy success vs Estrous activity strength at AI"
  page: 1
  x_axis: "Estrous activity strength at insemination (0 to 50 index)"
  saturation_point: 35.0
  response_curves:
    lactation_1_sexed_semen:
      service_1_range_pct: [46.0, 60.0]
      service_2_range_pct: [30.0, 46.0]
      service_3_range_pct: [25.0, 51.0]
    lactation_2_sexed_semen:
      service_1_range_pct: [38.0, 50.0]
      service_2_range_pct: [23.0, 39.0]
      service_3_range_pct: [20.0, 48.0]
    lactation_3plus_conventional_semen:
      service_1_range_pct: [44.0, 57.0]
      service_2_range_pct: [38.0, 56.0]
      service_3_range_pct: [32.0, 58.0]
    lactation_3plus_beef_semen:
      service_1_range_pct: [36.0, 49.0]
      service_2_range_pct: [33.0, 50.0]
      service_3_range_pct: [26.0, 52.0]

supplementary_figure_2:
  title: "Pregnancy success vs Estrous rumination strength at AI"
  page: 2
  x_axis: "Estrous rumination strength at insemination (0 to 20 index)"
  monotonic_positive_effect: true
  breeding_1_gain_pct_from_0_to_20: 18.5

supplementary_figure_3:
  title: "Daily Heritability (h^2) across DIM 11 to 110"
